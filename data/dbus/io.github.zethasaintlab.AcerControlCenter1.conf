<!DOCTYPE busconfig PUBLIC
 "-//freedesktop//DTD D-BUS Bus Configuration 1.0//EN"
 "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<busconfig>
    <!-- Only root (via systemd acer-control-daemon.service) may own the service name -->
    <policy user="root">
        <allow own="io.github.zethasaintlab.AcerControlCenter1"/>
        <allow send_destination="io.github.zethasaintlab.AcerControlCenter1"/>
        <allow receive_sender="io.github.zethasaintlab.AcerControlCenter1"/>
    </policy>

    <!-- Unprivileged desktop sessions may invoke methods; Polkit enforces per-action authorization inside the daemon -->
    <policy context="default">
        <allow send_destination="io.github.zethasaintlab.AcerControlCenter1"
               send_interface="io.github.zethasaintlab.AcerControlCenter1"/>
        <allow send_destination="io.github.zethasaintlab.AcerControlCenter1"
               send_interface="org.freedesktop.DBus.Introspectable"/>
        <allow send_destination="io.github.zethasaintlab.AcerControlCenter1"
               send_interface="org.freedesktop.DBus.Peer"/>
        <allow send_destination="io.github.zethasaintlab.AcerControlCenter1"
               send_interface="org.freedesktop.DBus.Properties"/>
    </policy>
</busconfig>
