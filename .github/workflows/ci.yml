name: Fedora 45 CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
      - feat/clv0001-keyboard-integration

permissions:
  contents: read

jobs:
  fedora45-build-test:
    name: fedora45-build-test
    runs-on: ubuntu-latest
    container:
      image: quay.io/fedora/fedora:45
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install build and validation dependencies
        run: |
          dnf -y install --setopt=install_weak_deps=False \
            cmake \
            ninja-build \
            gcc-c++ \
            desktop-file-utils \
            appstream \
            libxml2 \
            rpm-build \
            systemd-rpm-macros \
            qt6-qtbase-devel \
            qt6-qtdeclarative-devel \
            polkit-devel

      - name: Configure and build (CMake Release / Ninja)
        run: |
          cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build build -j"$(nproc)"

      - name: Run CTest unit and offscreen GUI suites
        run: |
          set -o pipefail
          ctest --test-dir build --output-on-failure --verbose | tee build/ctest.log

      - name: Staging install and desktop/AppStream/XML/spec checks
        run: |
          DESTDIR="$PWD/build/staging" cmake --install build --prefix /usr
          desktop-file-validate build/staging/usr/share/applications/io.github.zethasaintlab.acer-control-center.desktop
          appstreamcli validate --no-net build/staging/usr/share/metainfo/io.github.zethasaintlab.acer-control-center.metainfo.xml
          xmllint --noout \
            build/staging/usr/share/polkit-1/actions/io.github.zethasaintlab.acercontrol.policy \
            build/staging/usr/share/dbus-1/interfaces/io.github.zethasaintlab.AcerControlCenter1.xml
          rpmspec -P packaging/fedora/acer-control-center.spec >/dev/null

      - name: Upload CTest log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fedora45-ctest-log
          path: build/ctest.log
          if-no-files-found: ignore

  fedora45-rpm:
    name: fedora45-rpm
    runs-on: ubuntu-latest
    container:
      image: quay.io/fedora/fedora:45
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install RPM build dependencies
        run: |
          dnf -y install --setopt=install_weak_deps=False \
            git-core \
            tar \
            gzip \
            rpm-build \
            rpmlint \
            cmake \
            ninja-build \
            gcc-c++ \
            desktop-file-utils \
            appstream \
            systemd-rpm-macros \
            qt6-qtbase-devel \
            qt6-qtdeclarative-devel \
            polkit-devel

      - name: Export source archive and run rpmbuild -ba
        run: |
          set -o pipefail
          SPEC="packaging/fedora/acer-control-center.spec"
          NAME="$(rpmspec -q --qf '%{NAME}\n' "$SPEC" | head -n 1)"
          VERSION="$(rpmspec -q --qf '%{VERSION}\n' "$SPEC" | head -n 1)"
          TOPDIR="$PWD/build/ci-rpmbuild"
          mkdir -p "$TOPDIR"/{BUILD,BUILDROOT,RPMS,SOURCES,SPECS,SRPMS}
          git archive --format=tar.gz --prefix="${NAME}-${VERSION}/" \
            -o "$TOPDIR/SOURCES/${NAME}-${VERSION}.tar.gz" HEAD
          cp "$SPEC" "$TOPDIR/SPECS/"
          rpmbuild --define "_topdir $TOPDIR" -ba "$TOPDIR/SPECS/$(basename "$SPEC")" 2>&1 | tee "$TOPDIR/rpmbuild.log"

      - name: Verify RPM payload, checksums and rpmlint advisories
        run: |
          set -o pipefail
          TOPDIR="$PWD/build/ci-rpmbuild"
          MAIN_RPM="$(find "$TOPDIR/RPMS" -name 'acer-control-center-*.rpm' ! -name '*debug*' | head -n 1)"
          SRPM="$(find "$TOPDIR/SRPMS" -name '*.src.rpm' | head -n 1)"
          rpm -qip "$MAIN_RPM"
          if rpm -qlp "$MAIN_RPM" | grep -q '\.ko'; then
            echo "ERROR: Prebuilt kernel module found in RPM payload" >&2
            exit 1
          fi
          sha256sum "$MAIN_RPM" "$SRPM" | tee "$TOPDIR/SHA256SUMS"
          rpmlint packaging/fedora/acer-control-center.spec "$MAIN_RPM" "$SRPM" | tee "$TOPDIR/rpmlint.log" || true

      - name: Upload unsigned RPM build artifacts and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fedora45-rpm-artifacts
          path: |
            build/ci-rpmbuild/RPMS/**/*.rpm
            build/ci-rpmbuild/SRPMS/*.rpm
            build/ci-rpmbuild/SHA256SUMS
            build/ci-rpmbuild/rpmbuild.log
            build/ci-rpmbuild/rpmlint.log
          if-no-files-found: ignore
